{{- /* пилюля-пруф: дата + ссылка на сообщение; без ссылки — дата и откуда факт (via: «со слов Anore», «тест редакции») */ -}}
{{- with .proof }}<a class="src" href="{{ . }}" rel="nofollow noopener" target="_blank" title="Исходное сообщение в чате">{{ $.date | default "пруф" }}</a>{{ else }}{{ with $.date }}<span class="src"{{ with $.via }} title="{{ . }}"{{ end }}>{{ . }}{{ with $.via }} · {{ . }}{{ end }}</span>{{ end }}{{ end }}
